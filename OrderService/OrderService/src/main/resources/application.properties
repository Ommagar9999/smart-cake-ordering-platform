spring.application.name=OrderService

server.port=${PORT:8083}

# ===============================
# MYSQL - AIVEN
# ===============================

spring.datasource.url=jdbc:mysql://mysql-f2f05dc-ommagar3096-1fc5.f.aivencloud.com:20505/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# EUREKA
# ===============================

eureka.client.service-url.defaultZone=https://smart-cake-ordering-platform-2.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}