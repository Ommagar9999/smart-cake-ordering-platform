spring.application.name=eureka-server
server.port=${PORT:3030}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

eureka.server.enable-self-preservation=false
eureka.server.peer-node-read-timeout-ms=10000
eureka.server.peer-node-connect-timeout-ms=10000

eureka.client.service-url.defaultZone=https://smart-cake-ordering-platform-2.onrender.com/eureka/
eureka.instance.hostname=smart-cake-ordering-platform-2.onrender.com