spring.application.name=user-service
server.port=${PORT:8081}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# MySQL - Aiven
spring.datasource.url=jdbc:mysql://mysql-f2f05dc-ommagar3096-1fc5.f.aivencloud.com:20505/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=https://smart-cake-ordering-platform-2.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance - Render
eureka.instance.hostname=smart-cake-ordering-platform-3.onrender.com
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${PORT:8081}